<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>雨夜灯塔：失落的信标</title>
<style>
  :root {
    --paper: #0B132B; --ink: #F4F6FA; --ink2: #D2DAE6; --mute: #9BA7BA;
    --hair: #262C37; --amber: #F59E0B; --amber-text: #FCD34D; --cyan: #38BDF8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper);
    color: var(--ink); font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
  #stage { display: block; width: 100%; height: 100%; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; }
  #hud { position: fixed; left: 18px; bottom: 18px; z-index: 10; padding: 12px 16px; min-width: 320px;
    background: rgba(14,16,19,.78); border: 1px solid var(--hair); border-left: 2px solid var(--amber); }
  #hud .beat { display: flex; align-items: baseline; gap: 10px; }
  #hud .beat-id { font-size: 26px; font-weight: 800; color: var(--amber-text); letter-spacing: .04em; }
  #hud .beat-name { font-size: 13px; color: var(--ink2); }
  #hud .row { display: flex; gap: 14px; margin-top: 6px; font-size: 12px; color: var(--mute); }
  #hud .bar { margin-top: 9px; height: 3px; background: var(--hair); position: relative; }
  #hud .bar > i { position: absolute; inset: 0 auto 0 0; background: var(--amber); display: block; }
  #hud .hint { margin-top: 9px; font-size: 11px; color: #6b7688; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .06em;
    padding: 3px 8px; border: 1px solid var(--hair); color: var(--ink2); }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mute); }
  .badge.gpu .dot { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .badge.gl .dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  #panel { position: fixed; right: 18px; top: 18px; z-index: 10; width: 272px;
    background: rgba(14,16,19,.86); border: 1px solid var(--hair); border-top: 2px solid var(--amber); }
  #panel header { display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; cursor: pointer; user-select: none; }
  #panel header h2 { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
  #panel header .toggle { font-size: 12px; color: var(--mute); }
  #panel .body { padding: 0 12px 12px; display: none; }
  #panel.open .body { display: block; }
  #panel .sec { margin-top: 12px; }
  #panel .sec > h3 { font-size: 11px; color: var(--mute); letter-spacing: .08em; margin-bottom: 7px;
    border-bottom: 1px solid var(--hair); padding-bottom: 5px; }
  #panel .beats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  #panel .beats button { font: inherit; font-size: 11px; padding: 6px 0; cursor: pointer;
    background: #141820; color: var(--ink2); border: 1px solid var(--hair); }
  #panel .beats button:hover { border-color: var(--amber); color: var(--amber-text); }
  #panel .beats button.active { background: var(--amber); color: #0E1013; border-color: var(--amber); font-weight: 700; }
  #panel .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #panel button.act { font: inherit; font-size: 11px; padding: 6px 10px; cursor: pointer;
    background: #141820; color: var(--ink2); border: 1px solid var(--hair); }
  #panel button.act:hover { border-color: var(--amber); color: var(--amber-text); }
  #panel .note { font-size: 10.5px; color: #6b7688; line-height: 1.6; margin-top: 6px; }
  #panel .val { font-size: 11px; color: var(--amber-text); }
  #flash { position: fixed; inset: 0; z-index: 5; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="flash"></div>
  <div id="hud"></div>
  <div id="panel"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
